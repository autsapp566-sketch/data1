name: Auto Update Crypto Data

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas requests pyarrow openpyxl

    - name: Run collector script
      run: python crypto_collector.py

    - name: Commit and push updated data
      run: |
        git config --global user.name "GitHub Action Bot"
        git config --global user.email "bot@github.com"
        git add crypto_market_historical_1h.csv crypto_market_historical_1h.parquet
        git commit -m "Auto-update crypto dataset [skip ci]" || exit 0
        git push